    <main class="fikrinurfahmi_container">
        <div style="max-width: 400px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #ddd;">
            <h3 style="text-align: center; margin-bottom: 20px; color: #1b365d;">Login Internal Admin</h3>
            <form id="fikrinurfahmi_login_form">
                <div class="fikrinurfahmi_form_group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" class="fikrinurfahmi_form_input" required>
                </div>
                <div class="fikrinurfahmi_form_group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" class="fikrinurfahmi_form_input" required>
                </div>
                <button type="submit" class="fikrinurfahmi_btn_submit" style="width: 100%;">Masuk Sistem</button>
            </form>
        </div>
    </main>
